# Tool configuration only; RecallKit is not packaged for distribution yet.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "allow_network: opt out of the offline socket guard (local browser tests only)",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]